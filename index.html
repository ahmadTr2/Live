<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin: 20px 0;
    }

    .stream-container {
      position: relative;
      width: 80%;
      max-width: 1200px;
      aspect-ratio: 16/9;
      margin-bottom: 20px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .offline-message {
      background: #222;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      font-size: 1.2rem;
      width: 80%;
      max-width: 600px;
      display: none; /* hidden by default */
    }

    .offline-message a {
      color: #1e90ff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h1>🔴 Live Stream</h1>

  <!-- Live Stream Embed -->
  <div class="stream-container">
    <iframe
      src="https://www.youtube.com/embed/live_stream?channel=UCYzm6ZhK2oMt4dvBg6MqjGQ&autoplay=1"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Offline Message -->
  <div class="offline-message">
    ❌ We are currently offline.<br>
    Visit our <a href="https://www.youtube.com/@%D8%AA%D8%AC%D9%85%D8%B9%D8%B4%D8%A8%D8%A7%D8%A8%D8%B7%D9%84%D9%88%D8%B3%D8%A9%D8%A7%D9%84%D8%B1%D9%8A%D8%A7%D8%B6%D9%8A%D9%84%D9%83%D8%B1%D8%A9%D8%A7%D9%84%D9%82%D8%AF%D9%85" target="_blank">YouTube Channel</a> for updates.
  </div>

  <script>
    // Safe approach: just show the offline message after a delay
    // You cannot access the iframe directly due to cross-origin restrictions
    // This simply gives your viewers a nicer offline screen if you are not live

    setTimeout(() => {
      // Show offline message after 2 seconds
      // Users can still see the YouTube "offline" player inside the iframe
      const offlineMessage = document.querySelector('.offline-message');
      offlineMessage.style.display = 'block';
    }, 2000);
  </script>

</body>
</html>
